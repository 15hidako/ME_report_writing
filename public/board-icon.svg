<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="board-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12081f"/>
      <stop offset="1" stop-color="#3b1060"/>
    </linearGradient>
    <linearGradient id="board-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7fae"/>
      <stop offset="1" stop-color="#ff4d8d"/>
    </linearGradient>
    <radialGradient id="board-glow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ff4d8d" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff4d8d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#board-bg)"/>
  <circle cx="256" cy="230" r="190" fill="url(#board-glow)"/>
  <!-- 列 -->
  <g fill="#ffffff" fill-opacity="0.08">
    <rect x="76" y="96" width="104" height="320" rx="24"/>
    <rect x="204" y="96" width="104" height="320" rx="24"/>
    <rect x="332" y="96" width="104" height="320" rx="24"/>
  </g>
  <!-- カード: 左の列ほど多く、右端は投稿済み -->
  <g fill="url(#board-card)">
    <rect x="90" y="112" width="76" height="72" rx="16"/>
    <rect x="90" y="200" width="76" height="72" rx="16"/>
    <rect x="90" y="288" width="76" height="72" rx="16"/>
    <rect x="218" y="112" width="76" height="72" rx="16"/>
    <rect x="218" y="200" width="76" height="72" rx="16"/>
  </g>
  <rect x="346" y="112" width="76" height="72" rx="16" fill="#ffc93c"/>
</svg>
